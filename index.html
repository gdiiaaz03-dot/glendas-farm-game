<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glenda’s Farm">
<meta name="theme-color" content="#bfe3f5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Glenda’s Farm Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one-screen app. HUD on top, goals strip, fenced meadow fills the middle, barn + shop tray at the bottom. Single sunny look by choice. */
:root{
  --sky:#dff0c4; --meadow:#7fb446; --meadow-dk:#6aa036; --fence:#8a5a34;
  --barn:#b5452f; --straw:#fbf0c9; --ink:#3b2a1a; --gold:#f2b134; --water:#3f9bd6; --muted:#7a6650;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;z-index:0;height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}

.hud{display:flex;align-items:center;gap:8px}
.day{font-family:var(--display);font-size:1.5rem;color:var(--barn);letter-spacing:.5px;margin-right:auto;line-height:1}
.chip{display:flex;align-items:center;gap:5px;background:var(--straw);border:2px solid var(--fence);border-radius:999px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}

.goals{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.goals .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.goal{display:flex;align-items:center;gap:4px;background:#fff8;border-radius:8px;padding:3px 8px;font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:800}
.goal.ok{background:var(--meadow);color:#fff}

#field{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(90deg,var(--meadow) 0 38px,var(--meadow-dk) 38px 76px);
  border:6px solid var(--fence);box-shadow:inset 0 0 0 3px #a87648;touch-action:manipulation}
#field .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#3b2a1acc;color:#fff;font-size:.8rem;padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.ent{position:absolute;left:0;top:0;will-change:transform;line-height:1}
.grass{width:34px;height:22px;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 60%,#3f7d1f 0 45%,#4e9426 46% 70%,transparent 72%);pointer-events:none}
.grass::before,.grass::after{content:"";position:absolute;bottom:8px;width:4px;height:12px;background:#3f7d1f;border-radius:3px 3px 0 0}
.grass::before{left:10px;transform:rotate(-14deg)} .grass::after{right:10px;transform:rotate(14deg)}
.ani{pointer-events:none;display:flex;flex-direction:column;align-items:center}
.ani .spr{display:block;filter:drop-shadow(0 3px 0 #0003)}
.ani.walk .spr{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -3px}}
.ani .bar{width:28px;height:5px;background:#0003;border-radius:3px;overflow:hidden;margin-top:2px}
.ani .bar b{display:block;height:100%;background:var(--gold)}
.ani .bar b.low{background:var(--barn)}
.dog .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;white-space:nowrap}
.dog{cursor:pointer;pointer-events:auto}
.ico{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;font-style:normal;flex:none}.ico svg,.spr svg{width:100%;height:100%;display:block}
.dogspr{width:50px;height:50px}.dogspr svg,.pal svg{width:100%;height:100%;display:block}
.ani .need{position:absolute;top:-14px;right:-6px;background:#fff;border-radius:999px;font-size:11px;padding:1px 5px;font-weight:800;color:var(--barn);display:none}
.ani.hungry .need{display:block}
.prod{font-size:28px;cursor:pointer;padding:8px;margin:-8px;filter:drop-shadow(0 2px 0 #0004);animation:pop .3s ease-out}
.prod.old{animation:blink .4s steps(2) infinite}
@keyframes pop{from{scale:.2}}
@keyframes blink{50%{opacity:.35}}
.fox{font-size:40px;cursor:pointer;padding:6px;margin:-6px;filter:drop-shadow(0 3px 0 #0004)}
.fox.hit .spr{animation:shake .2s}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
.float{position:absolute;font-family:var(--display);color:#fff;font-size:1.1rem;text-shadow:0 2px 0 #0006;pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{to{translate:0 -40px;opacity:0}}

.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.act{display:flex;align-items:center;gap:10px;background:var(--straw);border:2px solid var(--fence);border-radius:12px;padding:8px 10px;text-align:left;min-width:0}
.act .ic{font-size:1.6rem}
.act .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.act .t{font-family:var(--display);font-size:1.05rem;line-height:1.1}
.act .s{font-size:.75rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:#0002;overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--water);transition:width .2s}
#sell{background:var(--barn);border-color:#7d2c1c;color:#fff}
#sell .s{color:#ffe3d6}
#sell[disabled]{opacity:.6}
.inv{display:flex;gap:8px;font-size:.85rem;font-variant-numeric:tabular-nums}

.shop{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.shop::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;background:#fff;border:2px solid var(--fence);border-radius:12px;padding:6px 4px}
.card .ic{font-size:1.7rem;line-height:1.1}
.card .n{font-size:.75rem;font-weight:800}
.card .p{font-family:var(--display);font-size:.9rem;color:var(--fence);font-variant-numeric:tabular-nums}
.card[disabled]{opacity:.45}
.card.locked .p{color:var(--muted);font-family:var(--body);font-size:.7rem;font-weight:800}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1}

#modal{position:fixed;inset:0;background:#3b2a1a88;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.sheet{background:var(--straw);border:4px solid var(--fence);border-radius:18px;padding:22px 20px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--barn);margin:0;text-wrap:balance}
.sheet p{margin:0;line-height:1.45}
.big{background:var(--meadow);color:#fff;font-family:var(--display);font-size:1.2rem;padding:12px;border-radius:12px;box-shadow:0 4px 0 var(--meadow-dk)}
.big:active{translate:0 2px;box-shadow:0 2px 0 var(--meadow-dk)}
.link{background:none;color:var(--muted);font-size:.8rem;text-decoration:underline}
.prod.gold{filter:drop-shadow(0 0 6px #ffd84a) drop-shadow(0 2px 0 #0004)}
.chip .st{color:var(--gold);letter-spacing:1px;text-shadow:0 1px 0 #8a5a3466}
.chip .st i{font-style:normal;color:#cbbd9c;text-shadow:none}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:960;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94%}
.banner span{background:#fffffff0;border:2px solid var(--fence);border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#field.rain::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,#ffffff38 0 2px,transparent 2px 16px);animation:rain .35s linear infinite;pointer-events:none;z-index:950}
#field.rain{filter:brightness(.9) saturate(1.15)}
@keyframes rain{to{background-position:-16px 46px}}
.combo{color:var(--gold)}
.works{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.wk{flex:1 0 108px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--fence);border-radius:12px;padding:6px 8px;text-align:left;min-width:0}
.wk .ic{font-size:1.5rem}
.wk .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.wk .t{font-family:var(--display);font-size:.95rem;line-height:1.1}
.wk .r{font-size:.75rem;font-weight:800;white-space:nowrap}
.wk .meter b{background:var(--gold)}
.wk.go{border-color:var(--meadow);box-shadow:0 0 0 2px var(--meadow) inset}
.stars{font-size:2.4rem;color:var(--gold);letter-spacing:4px;line-height:1}
.stars i{font-style:normal;color:#d8cba8}
#splash{position:fixed;inset:0;z-index:40;background:linear-gradient(#bfe3f5,#e9f6d8 55%,var(--sky));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
.logo{font-family:var(--display);font-weight:400;color:var(--barn);font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:0;text-shadow:0 3px 0 #fff,0 5px 0 #8a5a3455;text-wrap:balance}
.logo small{display:block;font-size:.42em;color:var(--fence);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;text-shadow:none}
.scene{position:relative;width:min(340px,88vw);aspect-ratio:340/250;max-width:100%}
.scene svg{width:100%;height:100%;display:block}
.pal{position:absolute;line-height:1;filter:drop-shadow(0 3px 0 #0003);animation:hop 1.6s ease-in-out infinite}
.pal b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:800 10px var(--body);background:var(--ink);color:#fff;padding:1px 6px;border-radius:999px;margin-bottom:2px;white-space:nowrap}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -6px}}
.heart{position:absolute;font-size:16px;animation:rise 2.4s ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;translate:0 0}20%{opacity:1}100%{opacity:0;translate:0 -46px}}
#play{min-width:200px}
.sp-note{font-size:.85rem;color:var(--muted);max-width:30ch;margin:0}
@media (prefers-reduced-motion:reduce){.pal,.heart{animation:none}.heart{opacity:1}}
@media (prefers-reduced-motion:reduce){.ani.walk .spr,.prod,.prod.old,.float,#field.rain::after{animation:none}}
</style>
</head>
<body>

<div id="app">
  <div class="hud">
    <div class="day" id="day">Day 1</div>
    <div class="chip" title="Day timer: finish fast for more stars"><i class="ico" data-art="clock"></i> <span id="clock">0:00</span> <span class="st" id="st"></span></div>
    <div class="chip" title="Coins"><i class="ico" data-art="coin"></i> <span id="coins">0</span></div>
  </div>
  <div class="goals" id="goals"></div>
  <div id="field"><div class="banner" id="banner"></div><div class="hint" id="hint">Tap the meadow to plant grass. Tap eggs to collect.</div></div>
  <div class="actions">
    <button class="act" id="well"><span class="ic"><i class="ico" data-art="bucket"></i></span><span class="tx"><span class="t">Well</span><span class="s" id="wellTx">Water 0/0</span><span class="meter"><b id="wellBar"></b></span></span></button>
    <button class="act" id="sell"><span class="ic"><i class="ico" data-art="truck"></i></span><span class="tx"><span class="t" id="sellT">Sell</span><span class="s" id="barnTx">Barn 0/0</span><span class="inv" id="inv"></span></span></button>
  </div>
  <div class="works" id="works" hidden></div>
  <div class="shop" id="shop"></div>
</div>
<div id="splash">
  <h1 class="logo">Glenda’s<br>Farm Game<small>with Kobe &amp; Kalani</small></h1>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 340 250">
      <circle cx="285" cy="48" r="26" fill="#f2b134"/>
      <circle cx="277" cy="45" r="2.6" fill="#3b2a1a"/><circle cx="293" cy="45" r="2.6" fill="#3b2a1a"/>
      <path d="M278 54q7 7 14 0" stroke="#3b2a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="271" cy="53" r="3.5" fill="#f08a6a" opacity=".6"/><circle cx="299" cy="53" r="3.5" fill="#f08a6a" opacity=".6"/>
      <g fill="#fff"><ellipse cx="60" cy="42" rx="26" ry="11"/><ellipse cx="76" cy="36" rx="16" ry="11"/><ellipse cx="190" cy="30" rx="20" ry="8"/><ellipse cx="202" cy="25" rx="12" ry="8"/></g>
      <path d="M0 150Q80 105 170 140T340 130V250H0Z" fill="#9fcb63"/>
      <path d="M0 175Q110 145 210 170T340 165V250H0Z" fill="#7fb446"/>
      <g transform="translate(118 62)">
        <path d="M-8 52L52 4 112 52Z" fill="#8a5a34"/>
        <rect x="2" y="48" width="100" height="78" fill="#b5452f"/>
        <path d="M-8 52L52 4 112 52" fill="none" stroke="#fbf0c9" stroke-width="6" stroke-linejoin="round"/>
        <rect x="40" y="22" width="24" height="18" rx="3" fill="#fbf0c9"/><rect x="45" y="27" width="14" height="10" fill="#7a3a2a"/>
        <rect x="32" y="76" width="40" height="50" fill="#fbf0c9"/>
        <path d="M32 76L72 126M72 76L32 126" stroke="#b5452f" stroke-width="5"/>
        <rect x="32" y="76" width="40" height="50" fill="none" stroke="#fbf0c9" stroke-width="5"/>
        <path d="M44 -6c-4-8 6-12 8-4 2-8 12-4 8 4l-8 8z" fill="#ef6f7a"/>
      </g>
      <g stroke="#8a5a34" stroke-width="5" stroke-linecap="round"><path d="M8 196H110M230 196H332M8 212H110M230 212H332"/><path d="M20 186V222M60 186V222M100 186V222M240 186V222M280 186V222M320 186V222"/></g>
      <g fill="#3f7d1f"><path d="M24 238l4-12 4 12zM300 240l4-12 4 12zM170 244l4-12 4 12z"/></g>
      <g><circle cx="40" cy="232" r="5" fill="#fff"/><circle cx="40" cy="232" r="2" fill="#f2b134"/><circle cx="318" cy="226" r="5" fill="#ffd1dc"/><circle cx="318" cy="226" r="2" fill="#f2b134"/></g>
    </svg>
    <span class="pal" style="left:24%;top:42%;width:40px;height:40px;animation-delay:.2s"><i class="spr" data-art="sheep"></i></span>
    <span class="pal" style="left:66%;top:40%;width:46px;height:46px;animation-delay:.6s"><i class="spr" data-art="cow"></i></span>
    <span class="pal" style="left:30%;top:64%;width:34px;height:34px;animation-delay:.9s"><i class="spr" data-art="chicken"></i></span>
    <span class="pal" style="left:59%;top:66%;width:28px;height:28px;animation-delay:.4s"><i class="spr" data-art="chick"></i></span>
    <span class="pal" id="palKobe" style="left:1%;top:50%;width:86px;height:86px"><b>Kobe</b></span>
    <span class="pal" id="palKalani" style="left:72%;top:48%;width:92px;height:92px;animation-delay:.5s"><b>Kalani</b></span>
    <span class="heart" style="left:46%;top:58%"><i class="ico" data-art="heartGold"></i></span>
    <span class="heart" style="left:52%;top:60%;animation-delay:1.2s"><i class="ico" data-art="heart"></i></span>
  </div>
  <button class="big" id="play">Play</button>
  <p class="sp-note" id="spNote">Grow grass, raise animals and sell at market.</p>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

  cake:{emoji:"🍰",price:45,name:"Cake"},scarf:{emoji:"🧣",price:80,name:"Scarves"},cheese:{emoji:"🧀",price:160,name:"Cheese"},
  gold:{emoji:"🌟",price:90,name:"Golden treasure"}
};
const WORKS={
  bakery:{name:"Bakery",ic:"🥖",in:{egg:3},out:"cake",time:8,cost:80,day:2},
  loom:{name:"Loom",ic:"🧵",in:{wool:2},out:"scarf",time:12,cost:160,day:3},
  dairy:{name:"Dairy",ic:"🥣",in:{milk:2},out:"cheese",time:15,cost:280,day:5}
};
for(const k in GOODS)GOODS[k].emoji=ico(k);for(const k in ANIMALS)ANIMALS[k].emoji=ico(k);for(const k in WORKS)WORKS[k].ic=ico(k);
const LEVELS=[
  {g:{egg:6},r:40,par:70},
  {g:{egg:10,coins:80},r:60,par:110},
  {g:{cake:2,wool:3},r:100,par:150},
  {g:{wool:6,coins:250},r:120,par:160},
  {g:{scarf:2,milk:3},r:150,par:190},
  {g:{cheese:2,cake:3,coins:500},r:220,par:230}
];
const FOX_DAY=3, SAVE_KEY="little-acre-farm-v1";
const goalsFor=l=>l<=LEVELS.length?LEVELS[l-1]:{g:{cake:2+l,scarf:1+(l>>1),cheese:1+Math.floor(l/3),coins:120*l},r:50*l,par:160+15*l};
const starsFor=(t,par)=>t<=par?3:t<=par*1.6?2:1;
const uid=()=>Math.random().toString(36).slice(2,9);
const mkAnimal=(type,x,y)=>({id:uid(),type,x,y,tx:x,ty:y,food:80,prod:Math.random()*.4,face:1,wait:0});
const mkGrass=(x,y)=>({id:uid(),x,y,amt:1});
const mkBarn=()=>Object.fromEntries(Object.keys(GOODS).map(k=>[k,0]));
const mkProg=()=>({...mkBarn(),coins:0});
const mkWorks=()=>Object.fromEntries(Object.keys(WORKS).map(k=>[k,{own:false,t:0,run:false,ready:false}]));
const mkDogs=()=>[{id:"kobe",name:"Kobe",job:"guard",emoji:"🐕",x:.15,y:.8,tx:.15,ty:.8,face:1,wait:0,cd:0},{id:"kalani",name:"Kalani",job:"fetch",emoji:"🐶",x:.85,y:.8,tx:.85,ty:.8,face:1,wait:0,cd:0}];
function fresh(){return{dogs:mkDogs(),coins:60,water:6,waterMax:8,barnCap:8,barnUpg:0,wellUpg:0,
  barn:mkBarn(),level:1,prog:mkProg(),works:mkWorks(),dayT:0,
  animals:[mkAnimal("chicken",.3,.45),mkAnimal("chicken",.65,.6)],
  grass:[mkGrass(.4,.5),mkGrass(.6,.4),mkGrass(.5,.7)],products:[],fox:null,foxIn:45,
  evIn:40,rain:0,boom:null,bone:null,zoom:0,done:false,seenHint:false}}
function migrate(o){
  const f=fresh(),s=Object.assign(f,o);
  s.barn=Object.assign(mkBarn(),o.barn);s.prog=Object.assign(mkProg(),o.prog);
  const w=mkWorks();for(const k in w)w[k]=Object.assign(w[k],(o.works||{})[k]);s.works=w;
  if(!o.dogs)s.dogs=mkDogs();
  return s;
}

let S;
const $=id=>document.getElementById(id);
const field=$("field");
let W=1,H=1;
function measure(){W=field.clientWidth;H=field.clientHeight}
addEventListener("resize",measure);

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.animals)return migrate(s)}catch(e){}return null}

let toastT;
function toast(msg){const t=$("toast");t.innerHTML=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2000)}
function floatText(x,y,txt,cls){const f=document.createElement("div");f.className="float"+(cls?" "+cls:"");f.innerHTML=txt;f.style.left=(x*W-10)+"px";f.style.top=(y*H-30)+"px";field.appendChild(f);setTimeout(()=>f.remove(),900)}

const barnCount=()=>Object.values(S.barn).reduce((a,b)=>a+b,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const priceOf=k=>GOODS[k].price*(S.boom&&S.boom.good===k?2:1);
const fmt=t=>{t=Math.floor(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const rnd=(a,b)=>a+Math.random()*(b-a);

function moveToward(e,tx,ty,spd,dt){
  const dx=(tx-e.x)*W,dy=(ty-e.y)*H,d=Math.hypot(dx,dy),m=spd*Math.min(W,H)*dt;
  if(Math.abs(dx)>1)e.face=dx>0?-1:1;
  if(d<=m){e.x=tx;e.y=ty;return true}
  e.x+=dx/d*m/W;e.y+=dy/d*m/H;return false;
}
const distPx=(a,b)=>Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);

/* ---------- input ---------- */
field.addEventListener("pointerdown",ev=>{
  if(S.done)return;
  const r=field.getBoundingClientRect();
  const x=clamp((ev.clientX-r.left)/W,.06,.94),y=clamp((ev.clientY-r.top)/H,.08,.94);
  if(S.water<1){toast("Out of water. Tap the well.");return}
  const near=S.grass.find(g=>distPx(g,{x,y})<28);
  if(near){if(near.amt>.95){toast("Grass is already full here");return}near.amt=1}
  else{if(S.grass.length>=30){toast("The meadow is full of grass");return}S.grass.push(mkGrass(x,y))}
  S.water--;hideHint();
});
function hideHint(){if(!S.seenHint){S.seenHint=true;$("hint").style.opacity=0}}

let filling=0;
$("well").onclick=()=>{
  if(filling)return;
  if(S.water>=S.waterMax){toast("Bucket is full");return}
  filling=0.0001;
};
$("sell").onclick=()=>{
  const n=barnCount();if(!n){toast("Barn is empty");return}
  let total=0;for(const k in S.barn){total+=S.barn[k]*priceOf(k);S.barn[k]=0}
  S.coins+=total;S.prog.coins+=total;toast(`Truck sold ${n} items for ${total} coins`);save();
};

let combo=0,lastCollect=0;
function collect(p){
  if(barnCount()>=S.barnCap){toast("Barn is full. Sell or build a bigger barn.");return}
  S.barn[p.type]++;S.prog[p.type]++;
  S.products=S.products.filter(q=>q!==p);hideHint();
  const now=performance.now();combo=now-lastCollect<1600?combo+1:1;lastCollect=now;
  if(p.type==="gold")toast("Golden treasure! Worth "+GOODS.gold.price+" coins");
  if(combo>=3){S.coins+=combo;floatText(p.x,p.y,`Combo x${combo} +${combo}${COIN}`,"combo")}
  else floatText(p.x,p.y,"+1 "+GOODS[p.type].emoji);
}
function hitFox(){
  const f=S.fox;if(!f||f.flee)return;
  f.hp--;f.hitT=.2;
  if(f.hp<=0){f.flee=true;f.tx=f.x<.5?-.2:1.2;f.ty=f.y;toast("The fox ran off!")}
}
function tapBone(){
  if(!S.bone)return;S.bone=null;S.zoom=20;
  toast("Zoomies! Kobe and Kalani run twice as fast");
}

/* ---------- workshops ---------- */
const recipe=w=>Object.entries(w.in).map(([k,n])=>n+GOODS[k].emoji).join(" ")+" → "+GOODS[w.out].emoji;
function useWork(k){
  const w=S.works[k],D=WORKS[k];
  if(w.run){toast(`${D.name} is busy`);return}
  if(w.ready){toast("Barn is full. Sell to make room.");return}
  const miss=Object.entries(D.in).find(([g,n])=>S.barn[g]<n);
  if(miss){toast(`${D.name} needs ${miss[1]} ${GOODS[miss[0]].emoji} in the barn`);return}
  for(const [g,n] of Object.entries(D.in))S.barn[g]-=n;
  w.run=true;w.t=0;
}
let worksSig="";const wkEls={};
function renderWorks(){
  const owned=Object.keys(WORKS).filter(k=>S.works[k].own);
  const sig=owned.join();
  const box=$("works");
  if(sig!==worksSig){
    worksSig=sig;box.innerHTML="";box.hidden=!owned.length;
    for(const k of owned){
      const D=WORKS[k],b=document.createElement("button");b.className="wk";b.id="wk-"+k;
      b.innerHTML=`<span class="ic">${D.ic}</span><span class="tx"><span class="t">${D.name}</span><span class="r">${recipe(D)}</span><span class="meter"><b></b></span></span>`;
      b.onclick=()=>useWork(k);box.appendChild(b);wkEls[k]=b;
    }
  }
  for(const k of owned){
    const w=S.works[k],D=WORKS[k],b=wkEls[k];
    b.querySelector(".meter b").style.width=(w.run?w.t*100:w.ready?100:0)+"%";
    b.classList.toggle("go",!w.run&&!w.ready&&Object.entries(D.in).every(([g,n])=>S.barn[g]>=n));
  }
}

/* ---------- shop ---------- */
function shopItems(){
  const a=Object.entries(ANIMALS).map(([k,v])=>({key:k,ic:v.emoji,n:v.name,cost:v.cost,locked:S.level<v.day,lockTx:"Day "+v.day,buy:()=>{
    S.animals.push(mkAnimal(k,.2+Math.random()*.6,.2+Math.random()*.6));toast(`New ${v.name.toLowerCase()} on the farm`)}}));
  for(const [k,D] of Object.entries(WORKS))if(!S.works[k].own)a.push({key:k,ic:D.ic,n:D.name,cost:D.cost,locked:S.level<D.day,lockTx:"Day "+D.day,buy:()=>{S.works[k].own=true;toast(`${D.name} built: ${recipe(D)}`)}});
  const bc=60*(S.barnUpg+1),wc=40*(S.wellUpg+1);
  a.push({key:"barn",ic:ico("barn"),n:`Barn +6`,cost:bc,buy:()=>{S.barnUpg++;S.barnCap+=6;toast(`Barn now holds ${S.barnCap}`)}});
  a.push({key:"well",ic:ico("water"),n:`Bucket +4`,cost:wc,buy:()=>{S.wellUpg++;S.waterMax+=4;toast(`Bucket now holds ${S.waterMax}`)}});
  return a;
}
let shopSig="";
function renderShop(){
  const items=shopItems();
  const sig=items.map(i=>i.key+i.cost+i.locked+(S.coins>=i.cost)).join();
  if(sig===shopSig)return;shopSig=sig;
  const box=$("shop");box.innerHTML="";
  for(const it of items){
    const b=document.createElement("button");b.className="card"+(it.locked?" locked":"");b.id="buy-"+it.key;
    b.disabled=it.locked||S.coins<it.cost;
    b.innerHTML=`<span class="ic">${it.ic}</span><span class="n">${it.n}</span><span class="p">${it.locked?it.lockTx:COIN+" "+it.cost}</span>`;
    b.onclick=()=>{if(S.coins<it.cost)return;S.coins-=it.cost;it.buy();shopSig="";save()};
    box.appendChild(b);
  }
}

/* ---------- events ---------- */
function startEvent(){
  const opts=["rain","boom","bone"];
  const type=opts[Math.floor(Math.random()*opts.length)];
  if(type==="rain"){
    S.rain=8;S.water=S.waterMax;
    for(let i=0;i<4&&S.grass.length<30;i++)S.grass.push(mkGrass(rnd(.1,.9),rnd(.15,.9)));
    toast("Rain shower! Free water and fresh grass");
  }else if(type==="boom"){
    const have=new Set(S.animals.map(a=>ANIMALS[a.type].prod));
    for(const k in WORKS)if(S.works[k].own)have.add(WORKS[k].out);
    const list=[...have];if(!list.length)return;
    const g=list[Math.floor(Math.random()*list.length)];
    S.boom={good:g,t:30};toast(`Market boom: ${GOODS[g].name} sell for double`);
  }else{
    S.bone={x:rnd(.15,.85),y:rnd(.2,.85),age:0};toast("A treat for the dogs! Tap the bone");
  }
}

/* ---------- simulation ---------- */
function update(dt){
  if(filling){filling+=dt/2.2;S.water=Math.min(S.waterMax,S.water+dt*S.waterMax/2.2);if(filling>=1||S.water>=S.waterMax){S.water=S.waterMax;filling=0}}
  if(S.done)return;
  S.dayT+=dt;

  // events
  if(S.level>=2){S.evIn-=dt;if(S.evIn<=0){S.evIn=rnd(40,70);startEvent()}}
  if(S.rain>0){S.rain-=dt;for(const g of S.grass)g.amt=Math.min(1,g.amt+.15*dt)}
  if(S.boom){S.boom.t-=dt;if(S.boom.t<=0)S.boom=null}
  if(S.zoom>0)S.zoom-=dt;
  if(S.bone){S.bone.age+=dt;if(S.bone.age>15)S.bone=null}

  for(const a of S.animals){
    const T=ANIMALS[a.type];
    a.food=Math.max(0,a.food-T.hunger*dt);
    a.walking=false;
    if(a.food<65&&S.grass.length){
      const g=S.grass.reduce((b,c)=>distPx(a,c)<distPx(a,b)?c:b);
      if(distPx(a,g)>14){a.walking=true;moveToward(a,g.x,g.y,T.speed,dt)}
      else{g.amt-=.45*dt;a.food=Math.min(100,a.food+40*dt);if(g.amt<=0)S.grass=S.grass.filter(x=>x!==g)}
    }else{
      if(a.wait>0)a.wait-=dt;
      else if(moveToward(a,a.tx,a.ty,T.speed*.6,dt)){a.tx=clamp(a.x+(Math.random()-.5)*.4,.08,.92);a.ty=clamp(a.y+(Math.random()-.5)*.4,.12,.92);a.wait=1+Math.random()*2.5}
      else a.walking=true;
    }
    if(a.food>0){a.prod+=dt/T.time;if(a.prod>=1){a.prod=0;
      const type=Math.random()<.04?"gold":T.prod;
      S.products.push({id:uid(),type,x:clamp(a.x+(Math.random()-.5)*.05,.05,.95),y:clamp(a.y+.04,.08,.95),age:0})}}
  }
  for(const p of S.products)p.age+=dt;
  S.products=S.products.filter(p=>p.age<25);

  // workshops
  for(const [k,w] of Object.entries(S.works)){
    if(!w.own)continue;
    if(w.run){w.t+=dt/WORKS[k].time;if(w.t>=1){w.run=false;w.t=0;w.ready=true}}
    if(w.ready&&barnCount()<S.barnCap){w.ready=false;const o=WORKS[k].out;S.barn[o]++;S.prog[o]++;toast(`${WORKS[k].name} finished: +1 ${GOODS[o].emoji}`)}
  }

  // dogs
  const z=S.zoom>0?2:1;
  for(const d of S.dogs){
    d.walking=false;d.cd=Math.max(0,d.cd-dt);
    const fx=S.fox;
    if(d.job==="guard"&&fx&&!fx.flee&&fx.x>0&&fx.x<1){
      d.walking=true;moveToward(d,fx.x,fx.y,.2*z,dt);
      if(distPx(d,fx)<26&&d.cd<=0){d.cd=1;fx.hp--;fx.hitT=.2;floatText(d.x,d.y,"Woof!");
        if(fx.hp<=0){fx.flee=true;fx.tx=fx.x<.5?-.2:1.2;fx.ty=fx.y;toast("Kobe chased the fox away!")}}
      continue;
    }
    if(d.job==="fetch"&&S.products.length&&barnCount()<S.barnCap){
      const p=S.products.reduce((b,c)=>c.age>b.age?c:b);
      d.walking=true;
      if(moveToward(d,p.x,p.y,.09*z,dt)||distPx(d,p)<10){S.barn[p.type]++;S.prog[p.type]++;S.products=S.products.filter(q=>q!==p);floatText(p.x,p.y,"Kalani +1 "+GOODS[p.type].emoji)}
      continue;
    }
    if(d.wait>0)d.wait-=dt*z;
    else if(moveToward(d,d.tx,d.ty,.1*z,dt)){d.tx=clamp(d.x+(Math.random()-.5)*.5,.08,.92);d.ty=clamp(d.y+(Math.random()-.5)*.5,.12,.92);d.wait=.5+Math.random()*2}
    else d.walking=true;
  }

  // fox
  const chickens=S.animals.filter(a=>a.type==="chicken");
  if(!S.fox&&S.level>=FOX_DAY&&chickens.length){
    S.foxIn-=dt;
    if(S.foxIn<=0){const left=Math.random()<.5;S.fox={x:left?-.05:1.05,y:.2+Math.random()*.6,hp:3,flee:false,face:1};S.foxIn=45+Math.random()*35;toast("A fox! Tap it 3 times to chase it off")}
  }
  const f=S.fox;
  if(f){
    if(f.hitT)f.hitT=Math.max(0,f.hitT-dt);
    if(f.flee){if(moveToward(f,f.tx,f.ty,.35,dt))S.fox=null}
    else if(!chickens.length){f.flee=true;f.tx=1.2;f.ty=f.y}
    else{
      const c=chickens.reduce((b,x)=>distPx(f,x)<distPx(f,b)?x:b);
      moveToward(f,c.x,c.y,.06,dt);
      if(distPx(f,c)<14){S.animals=S.animals.filter(x=>x!==c);f.flee=true;f.tx=f.x<.5?-.2:1.2;f.ty=f.y;toast("The fox took a chicken")}
    }
  }

  // goals
  const L=goalsFor(S.level);
  if(Object.entries(L.g).every(([k,v])=>S.prog[k]>=v)){S.done=true;S.doneStars=starsFor(S.dayT,L.par);showLevelDone(L);save()}
}

/* ---------- render ---------- */
const els=new Map();
function el(id,cls,html){let e=els.get(id);if(!e){e=document.createElement("div");e.className="ent "+cls;e.innerHTML=html;field.appendChild(e);els.set(id,e)}e._seen=true;return e}
function place(e,x,y,z){e.style.transform=`translate(${x*W-e.offsetWidth/2}px,${y*H-e.offsetHeight}px)`;e.style.zIndex=z}
const starHtml=n=>"★".repeat(n)+`<i>${"★".repeat(3-n)}</i>`;

function render(){
  for(const e of els.values())e._seen=false;
  for(const g of S.grass){const e=el(g.id,"grass","");e.style.opacity=.35+.65*g.amt;e.style.scale=.6+.4*g.amt;place(e,g.x,g.y+.03,1)}
  for(const p of S.products){
    const e=el(p.id,"prod"+(p.type==="gold"?" gold":""),GOODS[p.type].emoji);
    if(!e._bound){e._bound=1;e.addEventListener("pointerdown",ev=>{ev.stopPropagation();const q=S.products.find(q=>q.id===p.id);if(q)collect(q)})}
    e.classList.toggle("old",p.age>20);place(e,p.x,p.y,500+Math.round(p.y*400));
  }
  if(S.bone){
    const e=el("bone","prod gold",ico("bone"));
    if(!e._bound){e._bound=1;e.addEventListener("pointerdown",ev=>{ev.stopPropagation();tapBone()})}
    e.classList.toggle("old",S.bone.age>11);place(e,S.bone.x,S.bone.y,800);
  }
  for(const a of S.animals){
    const T=ANIMALS[a.type];
    const e=el(a.id,"ani",`<span class="need">hungry</span><span class="spr" style="width:${T.size+10}px;height:${T.size+10}px">${ART[a.type]}</span><i class="bar"><b></b></i>`);
    e.classList.toggle("walk",!!a.walking);e.classList.toggle("hungry",a.food<20);
    e.querySelector(".spr").style.transform=`scaleX(${a.face})`;
    const b=e.querySelector(".bar b");b.style.width=a.food+"%";b.classList.toggle("low",a.food<25);
    place(e,a.x,a.y,10+Math.round(a.y*400));
  }
  for(const d of S.dogs){
    const e=el("dog-"+d.id,"ani dog",`<span class="tag">${d.name}</span><span class="spr dogspr">${DOG_ART[d.id]}</span>`);
    if(!e._bound){e._bound=1;e.addEventListener("pointerdown",ev=>{ev.stopPropagation();floatText(d.x,d.y,d.job==="guard"?"Woof!":"Arf!");toast(d.job==="guard"?"Kobe guards the chickens from foxes":"Kalani fetches goods into the barn")})}
    e.classList.toggle("walk",!!d.walking);e.querySelector(".spr").style.transform=`scaleX(${d.face})`;
    place(e,d.x,d.y,10+Math.round(d.y*400));
  }
  if(S.fox){
    const f=S.fox,e=el("fox","fox",`<span class="spr" style="width:54px;height:54px">${ART.fox}</span>`);
    if(!e._bound){e._bound=1;e.addEventListener("pointerdown",ev=>{ev.stopPropagation();hitFox()})}
    e.classList.toggle("hit",!!f.hitT);e.querySelector(".spr").style.display="block";e.querySelector(".spr").style.transform=`scaleX(${f.face})`;
    place(e,f.x,f.y,900);
  }
  for(const [id,e] of els)if(!e._seen){e.remove();els.delete(id)}

  field.classList.toggle("rain",S.rain>0);
  const bn=[];
  if(S.rain>0)bn.push(ico("rain")+" Rain");
  if(S.boom)bn.push(`${ico("up")} ${GOODS[S.boom.good].emoji} x2 · ${Math.ceil(S.boom.t)}s`);
  if(S.zoom>0)bn.push(`${ico("bone")} Zoomies · ${Math.ceil(S.zoom)}s`);
  const bh=bn.map(b=>`<span>${b}</span>`).join("");
  if($("banner").innerHTML!==bh)$("banner").innerHTML=bh;

  // HUD
  const L=goalsFor(S.level);
  $("day").textContent="Day "+S.level;
  $("coins").textContent=Math.floor(S.coins);
  $("clock").textContent=fmt(S.dayT);
  const sh=starHtml(starsFor(S.dayT,L.par));if($("st").innerHTML!==sh)$("st").innerHTML=sh;
  $("wellTx").textContent=filling?"Drawing water…":`Water ${Math.floor(S.water)}/${S.waterMax}`;
  $("wellBar").style.width=(S.water/S.waterMax*100)+"%";
  const n=barnCount();
  $("barnTx").textContent=`Barn ${n}/${S.barnCap}`;
  let val=0;for(const k in S.barn)val+=S.barn[k]*priceOf(k);
  $("sellT").innerHTML=n?`Sell for ${COIN} ${val}`:"Sell";
  $("sell").disabled=!n;
  const inv=Object.keys(GOODS).filter(k=>S.barn[k]).map(k=>`<span>${GOODS[k].emoji}${S.barn[k]}</span>`).join("");
  if($("inv").innerHTML!==inv)$("inv").innerHTML=inv;
  const gh=`<span class="lbl">Goals</span>`+Object.entries(L.g).map(([k,v])=>{const have=Math.min(S.prog[k],v);const ic=k==="coins"?COIN:GOODS[k].emoji;return `<span class="goal${have>=v?" ok":""}">${ic} ${have}/${v}</span>`}).join("");
  if($("goals").innerHTML!==gh)$("goals").innerHTML=gh;
  renderWorks();
  renderShop();
}

/* ---------- modal ---------- */
function showLevelDone(L){
  const next=S.level+1,stars=S.doneStars||starsFor(S.dayT,L.par);
  const bonus=Math.round(L.r*.25*(stars-1));
  const unlocks=[...Object.values(ANIMALS).filter(a=>a.day===next).map(a=>`${a.emoji} ${a.name}`),...Object.values(WORKS).filter(w=>w.day===next).map(w=>`${w.ic} ${w.name}`)];
  let extra=unlocks.length?`<p>Now in the shop: ${unlocks.join(", ")}.</p>`:"";
  if(next===FOX_DAY)extra+=`<p>${ico("fox")} Foxes start sneaking in. Kobe will help.</p>`;
  if(next===2)extra+=`<p>${ico("rain")} Surprise events start tomorrow: rain, market booms and dog treats.</p>`;
  const tip=stars<3?`<p style="font-size:.85rem;color:var(--muted)">Finish under ${fmt(L.par)} for 3 stars.</p>`:"";
  $("sheet").innerHTML=`<h2>Day ${S.level} complete</h2><div class="stars">${starHtml(stars)}</div><p>Done in ${fmt(S.dayT)}. The co-op pays <b>${COIN} ${L.r}</b>${bonus?` plus a <b>${COIN} ${bonus}</b> star bonus`:""}.</p>${tip}${extra}<button class="big" id="nextDay">Start Day ${next}</button>`;
  $("modal").hidden=false;
  $("nextDay").onclick=()=>{S.coins+=L.r+bonus;S.level++;S.prog=mkProg();S.dayT=0;S.done=false;S.doneStars=0;$("modal").hidden=true;shopSig="";save()};
}
function showMenu(){
  $("sheet").innerHTML=`<h2>Glenda’s Farm Game</h2><p>Plant grass, feed your animals, collect what they make and truck it to market. Build workshops to turn goods into pricier treats. Finish each day fast for more stars.</p><p>Kobe guards the chickens. Kalani fetches goods into the barn.</p><button class="big" id="resume">Keep farming</button><button class="link" id="reset">Start a new farm</button>`;
  $("modal").hidden=false;
  $("resume").onclick=()=>{$("modal").hidden=true};
  $("reset").onclick=()=>{$("reset").textContent="Tap again to erase this farm";$("reset").onclick=()=>{S=fresh();for(const e of els.values())e.remove();els.clear();shopSig="";worksSig="x";$("hint").style.opacity=1;save();$("modal").hidden=true}};
}
$("day").style.cursor="pointer";$("day").onclick=showMenu;

/* ---------- loop ---------- */
let last=0,saveT=0,splashOn=true;
$("palKobe").insertAdjacentHTML("beforeend",DOG_ART.kobe);$("palKalani").insertAdjacentHTML("beforeend",DOG_ART.kalani);
$("play").onclick=()=>{splashOn=false;$("splash").classList.add("out");setTimeout(()=>$("splash").hidden=true,400)};
function frame(t){
  const dt=Math.min(.1,(t-last)/1000||0);last=t;
  if(!W||!H||W<2)measure();
  if($("modal").hidden&&!splashOn)update(dt);
  render();
  saveT+=dt;if(saveT>3){saveT=0;save()}
  requestAnimationFrame(frame);
}
function start(data){
  S=(data&&data.S)?migrate(data.S):(load()||fresh());
  if(S.seenHint)$("hint").style.opacity=0;
  if(S.done)showLevelDone(goalsFor(S.level));
  if(S.level>1||S.dayT>5){$("play").textContent="Continue Day "+S.level;$("spNote").textContent="Kobe and Kalani kept the farm safe while you were away."}
  measure();requestAnimationFrame(frame);
}
addEventListener("visibilitychange",()=>{if(document.hidden)save()});
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
